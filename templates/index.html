<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🔥 Real-Time Chat App</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
</head>

<body>
  <div class="chat-container">
    <h2>💬 Chat Room</h2>
    <button id="darkModeToggle">🌙 Toggle Dark Mode</button>

    <div id="messages" class="chat-box"></div>
    <div id="typing" class="typing-status"></div>

    <div class="input-area">
      <input id="message" type="text" placeholder="Type a message..." autocomplete="off" />
      <button onclick="sendMessage()">Send</button>
    </div>

    <form id="uploadForm" enctype="multipart/form-data">
      <input type="file" name="file" id="fileInput" />
      <button type="submit">📎 Upload File</button>
    </form>
  </div>

  <script>
    const socket = io();
    const username = prompt("Enter your name:") || "Anonymous";
    socket.emit("join", username);

    // Receive message
    socket.on('message', function(msg) {
      const msgDiv = document.createElement("div");
      msgDiv.className = "msg";

      // If it's a file link
      if (msg.includes("/uploads/")) {
        /*
          msgDiv.innerHTML = `<a href="${msg}" target="_blank">📎 File</a>`;
        */
        const link = document.createElement("a");
        link.href = msg;
        link.textContent = "📎 View uploaded file";
        link.target = "_blank";
        msgDiv.appendChild(link);
      } else {
        msgDiv.innerText = msg;
      }

      document.getElementById("messages").appendChild(msgDiv);
      document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;
      document.getElementById("notify").play();
    });

    // Send message
    function sendMessage() {
      const input = document.getElementById("message");
      if (input.value.trim() !== "") {
        socket.send(`${username}: ${input.value}`);
        input.value = "";
      }
    }

    // Typing event
    const typingDiv = document.getElementById("typing");
    let typingTimeout;
    document.getElementById("message").addEventListener("input", () => {
      socket.emit("typing", username);
    });
    socket.on("show_typing", name => {
      typingDiv.innerText = `${name} is typing...`;
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => typingDiv.innerText = "", 2000);
    });

    // Dark mode
    document.getElementById("darkModeToggle").addEventListener("click", () => {
      document.body.classList.toggle("dark");
    });

    // Upload file
    document.getElementById("uploadForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const fileInput = document.getElementById("fileInput");
      const file = fileInput.files[0];

      if (!file) return;

      const formData = new FormData();
      formData.append("file", file);

      fetch("/upload", {
        method: "POST",
        body: formData
      })
      .then(res => res.text())
      .then(link => {
        socket.send(`${username}: ${link}`);
        fileInput.value = "";
      });
    });
  </script>

  <audio id="notify" src="/static/pop.wav" preload="auto"></audio>
</body>
</html>
