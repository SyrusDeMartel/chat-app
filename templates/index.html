<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🔥 Real-Time Chat App</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
</head>

<body>
  <div class="chat-container">
    <h2>💬 Chat Room</h2>
    <button id="darkModeToggle">🌙 Toggle Dark Mode</button>

    <div id="users" class="user-list">
      <h4>Active Users</h4>
      <ul id="userList"></ul>
    </div>

    <div id="messages" class="chat-box"></div>
    <div id="typing" class="typing-status"></div>

    <div class="input-area">
      <input id="message" type="text" placeholder="Type a message..." autocomplete="off" />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const socket = io();
    let username = "";
    let isAdmin = false;

    function askCredentials() {
      const choice = prompt("Enter as:\n1. User/Guest\n2. Admin (type 'admin')");

      if (choice.toLowerCase() === "admin") {
        const pass = prompt("Enter admin password:");
        if (pass === "iamadmin") {
          username = prompt("Enter your name:") || "Admin";
          username += " (admin)";
          isAdmin = true;
        } else {
          alert("Wrong password. Entering as Guest.");
          username = prompt("Enter your name:") || "Guest";
        }
      } else {
        username = prompt("Enter your name:") || "Guest";
      }
    }

    askCredentials();
    socket.emit("join", username);

    // Receive message
    socket.on("message", function(msg) {
      const msgDiv = document.createElement("div");
      msgDiv.className = "msg";
      msgDiv.innerText = msg;
      document.getElementById("messages").appendChild(msgDiv);
      document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;
      document.getElementById("notify").play();
    });

    // Send message
    function sendMessage() {
      const input = document.getElementById("message");
      if (input.value.trim() !== "") {
        socket.send(`${username}: ${input.value}`);
        input.value = "";
      }
    }

    // Typing event
    const typingDiv = document.getElementById("typing");
    let typingTimeout;
    document.getElementById("message").addEventListener("input", () => {
      socket.emit("typing", username);
    });
    socket.on("show_typing", name => {
      typingDiv.innerText = `${name} is typing...`;
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => typingDiv.innerText = "", 2000);
    });

    // Dark mode
    document.getElementById("darkModeToggle").addEventListener("click", () => {
      document.body.classList.toggle("dark");
    });

    // Update user list
    socket.on("update_users", (userList) => {
      const listEl = document.getElementById("userList");
      listEl.innerHTML = "";

      userList.forEach((user) => {
        const li = document.createElement("li");
        li.textContent = user;

        // Show Kick button if viewer is admin and the other user is not
        if (isAdmin && !user.endsWith("(admin)")) {
          const btn = document.createElement("button");
          btn.textContent = "Kick";
          btn.className = "kick-btn";
          btn.onclick = () => socket.emit("kick_user", user);
          li.appendChild(btn);
        }

        listEl.appendChild(li);
      });
    });

    socket.on("kicked", function () {
      alert("You have been kicked by admin.");
      window.location.reload();
    });
  </script>

  <audio id="notify" src="/static/pop.wav" preload="auto"></audio>
</body>
</html>
